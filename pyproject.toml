[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oddsfox-pipeline"
version = "0.1.13"
description = "Dagster-orchestrated dlt + dbt + DuckDB pipeline for prediction-market data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
  "dagster>=1.13.13",
  "dagster-webserver>=1.8.0",
  "dagster-dbt>=0.24.0",
  "dagster-dlt>=0.24.0",
  "dbt-core>=1.11.12",
  "dbt-duckdb>=1.8.0",
  "dlt[duckdb]>=1.29.1",
  "duckdb>=1.5.4",
  "polars>=1.42.1",
  "pyarrow>=14.0.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0.0",
  "requests>=2.34.2",
  "tqdm>=4.68.4",
]

[tool.uv]
cache-dir = ".cache/runtime/uv"
# Contributors get the aggregate `dev` group by default; CI workers pass
# `--no-default-groups` and only the groups each job needs.
default-groups = ["dev"]

[dependency-groups]
# tomli backs terminology policy loading on Python 3.10 (tomllib is 3.11+).
test = [
  "hypothesis>=6.156.6",
  "pytest>=8.0.0",
  "pytest-xdist>=3.5.0",
  "tomli>=2.0.0; python_version < '3.11'",
  "vcrpy>=6.0.0",
]
coverage = [
  {include-group = "test"},
  "pytest-cov>=5.0.0",
]
python-lint = [
  "ruff>=0.15.21",
]
dbt-lint = [
  "sqlfluff>=4.2.2",
  "sqlfluff-templater-dbt>=3.0.0",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
]
docs-render = [
  {include-group = "docs"},
  "playwright>=1.55.0,<2",
]
mutation = [
  {include-group = "test"},
  "mutmut==3.6.0",
]
dev = [
  {include-group = "coverage"},
  {include-group = "python-lint"},
  {include-group = "dbt-lint"},
  {include-group = "docs-render"},
  {include-group = "mutation"},
  "dagster-dg-cli>=1.13.0",
  "pip-audit>=2.10.1",
]

[project.optional-dependencies]
dev = [
  "dagster-dg-cli>=1.13.0",
  "hypothesis>=6.156.6",
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mutmut==3.6.0",
  "playwright>=1.55.0,<2",
  "pip-audit>=2.10.1",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.15.21",
  "sqlfluff>=4.2.2",
  "sqlfluff-templater-dbt>=3.0.0",
  "vcrpy>=6.0.0",
]

[tool.mutmut]
source_paths = ["src/oddsfox_pipeline"]
only_mutate = [
  "src/oddsfox_pipeline/resources/outbound_url.py",
  "src/oddsfox_pipeline/contracts/raw_snapshots.py",
  "src/oddsfox_pipeline/ingestion/polymarket/market_scope/predicates.py",
  "src/oddsfox_pipeline/ingestion/polymarket/markets/persistence.py",
  "src/oddsfox_pipeline/ingestion/polymarket/odds/planning.py",
]
pytest_add_cli_args = ["--hypothesis-seed=20260725"]
pytest_add_cli_args_test_selection = [
  "tests/unit/resources/test_outbound_url.py",
  "tests/unit/contracts/test_raw_snapshots.py",
  "tests/unit/ingestion/market_scope/test_predicates.py",
  "tests/unit/ingestion/test_market_persistence.py",
  "tests/unit/ingestion/test_odds_planning.py",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["oddsfox_pipeline*"]

[tool.setuptools.package-data]
oddsfox_pipeline = [
  "ingestion/kalshi/seeds/*.yml",
  "ingestion/polymarket/seeds/*.yml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "ignore:.*AssetExecutionContext\\.op is deprecated.*:DeprecationWarning:dagster_dbt.asset_utils",
]
markers = [
  "facade: facade-level orchestration tests",
  "contract: replay-only external API contract tests excluded from default gates",
  "integration: hits external tools or shared resources",
  "performance: long-running benchmarks",
  "slow: expensive checks excluded from normal unit runs",
  "repo_check: repository policy checks; run via make check-repository",
]

[tool.coverage.run]
branch = true
source = ["src/oddsfox_pipeline"]
omit = ["src/oddsfox_pipeline/storage/duckdb/profile/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
src = ["src"]
line-length = 88
extend-exclude = [
  "dbt/target",
  "dbt/dbt_packages",
  ".venv",
  ".dagster_home",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"src/oddsfox_pipeline/config/__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"

[tool.sqlfluff.core]
dialect = "duckdb"
templater = "dbt"
max_line_length = 130
max_parse_depth = 1024
large_file_skip_byte_limit = 0

[tool.sqlfluff.templater.dbt]
project_dir = "dbt"
profiles_dir = "dbt/profiles"
profile = "oddsfox"
target = "dev"
dbt_skip_compilation_error = false
