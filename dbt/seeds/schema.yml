version: 2

seeds:
  - name: polymarket_wc2026_pipeline_policy
    description: Internal WC2026 pipeline policy constants shared by dbt models/tests and Python parity tests.
    columns:
      - name: scope_name
        description: Fixed scope name for the WC2026 Polymarket pipeline.
        tests: [not_null, unique]
      - name: event_min_lifetime_volume_usd
        description: Minimum reported Polymarket event lifetime volume for sticky admission.
        tests: [not_null]
      - name: results_freshness_hours
        description: Maximum age in hours before the FIFA result source load is stale.
        tests: [not_null]

  - name: polymarket_wc2026_polygon_settlement_markets
    description: >
      Header-only schema shell for an operator-supplied WC2026 proposition
      manifest used by Polygon settlement analytics. Runtime manifests do not
      depend on Gamma, CLOB, or Polymarket UI metadata.
    config:
      tags: [polygon_settlement]
    tests:
      - no_duplicate_grain:
          arguments:
            grain_columns: [proposition_id]
    columns:
      - name: proposition_id
        tests: [not_null, unique]
      - name: fifa_match_id
        tests: [not_null]
      - name: stage
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [group_stage, round_of_32, round_of_16, quarterfinal, semifinal, third_place, final]
      - name: proposition_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [home_win, draw, away_win, home_advances, home_win_third_place, home_wins_final]
      - name: condition_id
        tests: [not_null, unique]
      - name: yes_token_id
        tests: [not_null, unique]
      - name: no_token_id
        tests: [not_null, unique]
      - name: market_structure
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [standard, neg_risk]
      - name: exchange_address
        tests: [not_null]
      - name: manifest_sha256
        description: Canonical logical-content hash repeated on every reviewed manifest row.
        tests: [not_null]
      - name: manifest_version
        tests: [not_null]
      - name: reviewed_at_utc
        tests: [not_null]

  - name: kalshi_wc2026_pipeline_policy
    description: Internal Kalshi WC2026 pipeline policy constants shared by dbt models/tests and Python parity tests.
    columns:
      - name: scope_name
        description: Fixed scope name for the Kalshi WC2026 pipeline.
        tests: [not_null, unique]
      - name: hourly_window_days
        description: Trailing hourly odds window in days (full tournament).
        tests: [not_null]
      - name: hourly_window_hours
        description: Trailing hourly odds window in hours (full tournament).
        tests: [not_null]
      - name: live_freshness_hours
        description: Maximum age in hours for a live current price to be fresh.
        tests: [not_null]
      - name: results_freshness_hours
        description: Maximum age in hours before the FIFA result source load is stale.
        tests: [not_null]
