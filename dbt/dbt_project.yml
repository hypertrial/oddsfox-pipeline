name: oddsfox
version: 0.1.8
config-version: 2
profile: oddsfox
# Avoid running relationship tests whose parent models are not in the selected subgraph
# (default `eager` can execute tests on e.g. stg_polymarket_wc2026_odds_daily when only upstream
# of another branch is selected, causing missing-relation errors).
flags:
  indirect_selection: buildable
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]
models:
  oddsfox:
    +materialized: view
    +persist_docs:
      relation: true
      columns: true
    polymarket_catalog:
      +tags: ["polymarket", "catalog"]
      staging:
        +schema: polymarket_catalog_staging
        +tags: ["staging", "polymarket", "catalog"]
    polymarket_wc2026:
      +tags: ["wc2026", "polymarket"]
      staging:
        +schema: polymarket_wc2026_staging
        +tags: ["staging", "wc2026", "polymarket"]
      intermediate:
        +schema: polymarket_wc2026_intermediate
        +tags: ["intermediate", "wc2026", "polymarket"]
        int_polymarket_wc2026_token_hourly_odds:
          +materialized: incremental
        int_polymarket_wc2026_token_working_set:
          +materialized: table
        int_polymarket_wc2026_primary_market_token:
          +materialized: table
      marts:
        +schema: polymarket_wc2026_marts
        +materialized: table
        +tags: ["mart", "core", "wc2026", "polymarket"]
        polymarket_wc2026_market_hourly_odds:
          +materialized: table
      observability:
        +schema: polymarket_wc2026_observability
        +materialized: table
        +tags: ["mart", "observability", "wc2026", "polymarket"]
    polymarket_soccer:
      +tags: ["soccer", "polymarket", "minute_odds"]
      staging:
        +schema: polymarket_soccer_staging
        +tags: ["staging", "soccer", "polymarket"]
      intermediate:
        +schema: polymarket_soccer_intermediate
        +tags: ["intermediate", "soccer", "polymarket"]
      marts:
        +schema: polymarket_soccer_marts
        +materialized: table
        +tags: ["mart", "core", "soccer", "polymarket"]
      observability:
        +schema: polymarket_soccer_observability
        +materialized: table
        +tags: ["mart", "observability", "soccer", "polymarket"]
    kalshi_wc2026:
      +tags: ["wc2026", "kalshi"]
      staging:
        +schema: kalshi_wc2026_staging
        +tags: ["staging", "wc2026", "kalshi"]
      intermediate:
        +schema: kalshi_wc2026_intermediate
        +tags: ["intermediate", "wc2026", "kalshi"]
        int_kalshi_wc2026_market_hourly_odds:
          +materialized: incremental
      marts:
        +schema: kalshi_wc2026_marts
        +materialized: table
        +tags: ["mart", "core", "wc2026", "kalshi"]
        kalshi_wc2026_stage_markets:
          +materialized: view
        kalshi_wc2026_stage_market_hourly_odds:
          +materialized: view
        kalshi_wc2026_group_winner_markets:
          +materialized: view
        kalshi_wc2026_group_winner_market_hourly_odds:
          +materialized: view
      observability:
        +schema: kalshi_wc2026_observability
        +materialized: table
        +tags: ["mart", "observability", "wc2026", "kalshi"]
    wc2026:
      +tags: ["wc2026", "wc2026_strategy"]
      marts:
        +schema: wc2026_marts
        +materialized: table
        +tags: ["mart", "core", "wc2026", "wc2026_strategy"]
      observability:
        +schema: wc2026_observability
        +materialized: table
        +tags: ["mart", "observability", "wc2026", "wc2026_strategy"]
seeds:
  oddsfox:
    polymarket_wc2026_pipeline_policy:
      +schema: polymarket_wc2026_staging
      +tags: ["staging", "wc2026", "polymarket"]
      +quote_columns: false
    polymarket_wc2026_polygon_settlement_markets:
      +schema: polymarket_wc2026_staging
      +tags: ["staging", "wc2026", "polymarket", "polygon_settlement"]
      +quote_columns: false
      +column_types:
        proposition_id: varchar
        fifa_match_id: varchar
        stage: varchar
        group_label: varchar
        home_team: varchar
        away_team: varchar
        kickoff_at_utc: varchar
        window_start_at_utc: varchar
        window_end_at_utc: varchar
        proposition_type: varchar
        yes_represents: varchar
        no_represents: varchar
        condition_id: varchar
        yes_token_id: varchar
        no_token_id: varchar
        exchange_address: varchar
        market_structure: varchar
        reference_bundle_id: varchar
        reference_table: varchar
        reference_row_key: varchar
        reference_row_sha256: varchar
        condition_init_tx_hash: varchar
        condition_init_log_index: varchar
        question_init_tx_hash: varchar
        question_init_log_index: varchar
        ancillary_data_sha256: varchar
        token_verification_block_number: varchar
        token_verification_block_hash: varchar
        manifest_sha256: varchar
        manifest_version: varchar
        reviewed_at_utc: varchar
    kalshi_wc2026_pipeline_policy:
      +schema: kalshi_wc2026_staging
      +tags: ["staging", "wc2026", "kalshi"]
      +quote_columns: false
