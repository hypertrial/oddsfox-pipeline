version: 2

models:
  - name: int_polymarket_wc2026_markets
    description: >
      WC2026 Polymarket markets admitted by polymarket_wc2026_ops.market_scope_registry
      for sticky event-volume-eligible enclosing events, joined to latest event metadata.
    tests:
      - no_duplicate_grain:
          arguments:
            grain_columns: [scope_name, market_id]
    columns:
      - name: market_id
        description: Polymarket market identifier.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_polymarket_wc2026_markets')
                field: market_id
      - name: scope_name
        description: Scope name, fixed to wc2026.
        tests: [not_null]
      - name: event_slug
        description: Event slug when present in source metadata.

  - name: int_polymarket_wc2026_token_working_set
    description: >
      Canonical token working set: one row per CLOB outcome token joined to market
      labels, state, and volume.
    columns:
      - name: clob_token_id
        description: CLOB outcome token identifier.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_polymarket_wc2026_market_tokens')
                field: clob_token_id
      - name: market_id
        description: Polymarket market identifier for this token.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_polymarket_wc2026_markets')
                field: market_id
      - name: outcome_index
        description: Zero-based outcome index from the market token mapping.
        tests: [not_null]
      - name: token_updated_at
        description: UTC timestamp when the raw market_tokens row was last written.
      - name: question
        description: Market prompt text from staging markets.
      - name: outcome_label
        description: Resolved outcome label from the market outcomes array.
      - name: event_slug
        description: Event slug for grouping related markets.
      - name: is_active
        description: Whether the market is currently active in staging metadata.
      - name: is_closed
        description: Whether the market is closed in staging metadata.
      - name: market_volume_usd
        description: Reported market volume from staging metadata.

  - name: int_polymarket_wc2026_primary_market_token
    description: >
      One primary CLOB token per admitted WC2026 market used by the golden hourly
      odds mart. Prefers the Yes-labeled outcome when present; otherwise falls
      back to outcome_index 0 (tiebreak clob_token_id ascending). Covers Yes/No
      propositions plus advance, totals, spreads, corners, and other non-Yes
      market types.
    columns:
      - name: market_id
        tests: [not_null, unique]
      - name: clob_token_id
        tests: [not_null]
      - name: outcome_label
        description: >
          Label of the selected primary outcome (Yes, Over, a team name, etc.).
        tests: [not_null]

  - name: int_polymarket_wc2026_token_hourly_odds
    description: >
      Incremental hourly OHLC price fact for Polymarket CLOB tokens across full
      lifetime history. The golden market hourly odds mart joins this fact to market
      and event metadata.
    tests:
      - no_duplicate_grain:
          arguments:
            grain_columns: [clob_token_id, odds_hour_epoch]
      - price_columns_in_unit_interval:
          arguments:
            identifier_columns: [clob_token_id, odds_hour_epoch]
            price_columns:
              - open_price
              - high_price
              - low_price
              - close_price
              - avg_price
    columns:
      - name: clob_token_id
        description: Source CLOB outcome token identifier.
        tests: [not_null]
      - name: odds_hour_utc
        description: UTC hourly odds bucket.
        tests: [not_null]
      - name: odds_hour_epoch
        description: Unix epoch seconds for the UTC hour bucket.
        tests: [not_null]
      - name: open_price
        description: First observed price in the hour.
      - name: high_price
        description: Highest observed price in the hour.
      - name: low_price
        description: Lowest observed price in the hour.
      - name: close_price
        description: Last observed price in the hour.
      - name: avg_price
        description: Average observed price in the hour.
      - name: observed_points
        description: Number of raw odds points observed in the hour.
        tests: [not_null]
      - name: latest_ingested_at
        description: Latest raw ingestion timestamp represented in this hourly bucket.

unit_tests:
  - name: test_primary_market_token_prefers_yes_and_falls_back_to_outcome_index_zero
    model: int_polymarket_wc2026_primary_market_token
    given:
      - input: ref('int_polymarket_wc2026_token_working_set')
        rows:
          - {market_id: moneyline-1, outcome_index: 0, clob_token_id: ml-no, token_updated_at: '2026-07-01 12:00:00', outcome_label: 'No'}
          - {market_id: moneyline-1, outcome_index: 1, clob_token_id: ml-yes, token_updated_at: '2026-07-01 12:00:00', outcome_label: 'Yes'}
          - {market_id: advance-1, outcome_index: 0, clob_token_id: portugal-token, token_updated_at: '2026-07-01 12:00:00', outcome_label: Portugal}
          - {market_id: advance-1, outcome_index: 1, clob_token_id: spain-token, token_updated_at: '2026-07-01 12:00:00', outcome_label: Spain}
          - {market_id: totals-1, outcome_index: 0, clob_token_id: over-token, token_updated_at: '2026-07-01 12:00:00', outcome_label: Over}
          - {market_id: totals-1, outcome_index: 1, clob_token_id: under-token, token_updated_at: '2026-07-01 12:00:00', outcome_label: Under}
      - input: ref('int_polymarket_wc2026_markets')
        rows:
          - {market_id: moneyline-1}
          - {market_id: advance-1}
          - {market_id: totals-1}
    expect:
      rows:
        - {market_id: moneyline-1, clob_token_id: ml-yes, outcome_label: 'Yes', outcome_index: 1}
        - {market_id: advance-1, clob_token_id: portugal-token, outcome_label: Portugal, outcome_index: 0}
        - {market_id: totals-1, clob_token_id: over-token, outcome_label: Over, outcome_index: 0}

