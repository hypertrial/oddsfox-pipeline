version: 2

models:
  - name: int_polymarket_wc2026_logical_team_identities
    description: >-
      Unique source-label lookup keys mapped to stable canonical World Cup team
      identities. Multiple aliases may share one canonical team identifier.
    columns:
      - name: team_match_key
        tests: [not_null, unique]
      - name: canonical_match_key
        tests: [not_null]
      - name: canonical_team_id
        tests: [not_null]

  - name: int_polymarket_wc2026_logical_team_groups
    description: >-
      OpenFootball team-to-group mapping for teams with exactly one distinct
      group label across the official fixture schedule.
    columns:
      - name: canonical_team_id
        tests: [not_null, unique]
      - name: group_label
        tests: [not_null]

  - name: int_polymarket_wc2026_logical_markets
    columns:
      - name: market_id
        tests: [not_null, unique]
      - name: market_family
        tests: [not_null]
      - name: logical_usable
        tests: [not_null]

  - name: int_polymarket_wc2026_fixture_events
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: fifa_match_id
        tests: [not_null]
      - name: fixture_mapping_basis
        tests: [not_null]
