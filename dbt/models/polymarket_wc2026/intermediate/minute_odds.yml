version: 2

models:
  - name: int_polymarket_wc2026_futures_token_minute_odds
    description: >
      Pass-through view over publish-time primary-token minute OHLC for
      registry-eligible WC2026 futures. Raw history retains every CLOB token in
      the immutable Parquet snapshot; this intermediate does not re-aggregate.
    config:
      tags: [minute_odds]

  - name: int_polymarket_wc2026_token_minute_odds
    description: >
      Unified primary-token minute OHLC for match-window and futures-tournament-span
      markets. Prefer match source on any accidental (clob_token_id, odds_minute_epoch)
      clash via anti-join. View over match OHLC plus landed futures primary OHLC.
    config:
      tags: [minute_odds]
    tests:
      - price_columns_in_unit_interval:
          arguments:
            identifier_columns: [market_id, odds_minute_epoch]
            price_columns:
              - open_price
              - high_price
              - low_price
              - close_price
              - avg_price
    columns:
      - name: market_id
        tests: [not_null]
      - name: clob_token_id
        tests: [not_null]
      - name: odds_minute_epoch
        tests: [not_null]
      - name: minute_source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['match', 'futures']

unit_tests:
  - name: test_futures_token_minute_ohlc_passthrough_primary_fact
    model: int_polymarket_wc2026_futures_token_minute_odds
    given:
      - input: source('polymarket_wc2026_raw', 'futures_primary_minute_ohlc')
        rows:
          - {
              market_id: futures-1,
              clob_token_id: futures-yes,
              odds_minute_epoch: 1782907200,
              odds_minute_utc: '2026-07-01 12:00:00',
              open_price: 0.2,
              high_price: 0.4,
              low_price: 0.2,
              close_price: 0.4,
              avg_price: 0.3,
              observed_points: 2,
              first_observed_at: '2026-07-01 12:00:30',
              last_observed_at: '2026-07-01 12:00:50'
            }
    expect:
      rows:
        - {
            market_id: futures-1,
            clob_token_id: futures-yes,
            odds_minute_epoch: 1782907200,
            open_price: 0.2,
            high_price: 0.4,
            low_price: 0.2,
            close_price: 0.4,
            avg_price: 0.3,
            observed_points: 2
          }

  - name: test_token_minute_odds_prefers_match_over_futures_on_clash
    model: int_polymarket_wc2026_token_minute_odds
    given:
      - input: source('polymarket_wc2026_raw', 'match_primary_minute_ohlc')
        rows:
          - {
              market_id: match-1,
              clob_token_id: shared-yes,
              odds_minute_utc: '2026-07-01 12:00:00',
              odds_minute_epoch: 1782907200,
              open_price: 0.55,
              high_price: 0.55,
              low_price: 0.55,
              close_price: 0.55,
              avg_price: 0.55,
              observed_points: 1,
              first_observed_at: '2026-07-01 12:00:10',
              last_observed_at: '2026-07-01 12:00:10'
            }
      - input: ref('int_polymarket_wc2026_futures_token_minute_odds')
        rows:
          - {market_id: futures-1, clob_token_id: shared-yes, odds_minute_utc: '2026-07-01 12:00:00', odds_minute_epoch: 1782907200, open_price: 0.11, high_price: 0.11, low_price: 0.11, close_price: 0.11, avg_price: 0.11, observed_points: 1, first_observed_at: '2026-07-01 12:00:50', last_observed_at: '2026-07-01 12:00:50'}
          - {market_id: futures-2, clob_token_id: futures-only, odds_minute_utc: '2026-07-01 12:01:00', odds_minute_epoch: 1782907260, open_price: 0.7, high_price: 0.7, low_price: 0.7, close_price: 0.7, avg_price: 0.7, observed_points: 1, first_observed_at: '2026-07-01 12:01:10', last_observed_at: '2026-07-01 12:01:10'}
    expect:
      rows:
        - {market_id: match-1, clob_token_id: shared-yes, odds_minute_epoch: 1782907200, open_price: 0.55, minute_source: match}
        - {market_id: futures-2, clob_token_id: futures-only, odds_minute_epoch: 1782907260, open_price: 0.7, minute_source: futures}
