            null::varchar as fixture_group_label,
            null::varchar as fixture_stage
      - input: ref('int_polymarket_wc2026_logical_team_groups')
        format: sql
        rows: |
          select 'usa-id' as canonical_team_id, 'a' as group_label
          union all select 'paraguay-id', 'a'
      - input: ref('int_polymarket_wc2026_logical_team_identities')
        format: sql
        rows: |
          select 'usa' as team_match_key, 'usa-id' as canonical_team_id
          union all select 'paraguay', 'paraguay-id'
      - input: ref('wc2026_team_canonical_aliases')
        format: sql
        rows: |
