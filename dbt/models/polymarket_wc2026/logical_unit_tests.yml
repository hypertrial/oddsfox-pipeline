            'usa-reach-final' as slug,
            'Will USA reach the World Cup final?' as question,
            '' as description, null::varchar as market_resolution_source,
            '["Yes","No"]' as outcomes, '["stage-y","stage-n"]' as clob_token_ids,
            '[]' as tags, 1000.0 as volume, true as is_active,
            false as is_closed, false as is_resolved,
            null::varchar as winning_outcome,
            null::varchar as winning_clob_token_id,
            null::varchar as sports_market_type,
            null::varchar as group_item_title,
            null::varchar as group_item_threshold, null::double as line,
            null::timestamp as game_start_time,
            null::timestamp as event_start_time,
            timestamp '2026-01-01' as created_at,
            timestamp '2026-07-19' as end_date,
            null::varchar as neg_risk_market_id,
