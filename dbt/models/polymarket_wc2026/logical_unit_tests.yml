            '["Yes","No"]', '["player-y","player-n"]', '[]', 1000.0,
            true, false, false, null, null, 'soccer_player_goals',
            'Lionel Messi', null, null, null, null, timestamp '2026-01-01',
            timestamp '2026-07-19', null, null, null
      - input: ref('int_polymarket_wc2026_logical_market_events')
        format: sql
        rows: |
          select 'm-stage' as market_id, 'event-multi' as event_id,
