version: 2

unit_tests:
  - name: test_wc2026_event_eligibility_is_exact_and_sticky
    model: int_polymarket_wc2026_event_latest
    given:
      - input: ref('stg_polymarket_wc2026_event_snapshots')
        format: sql
        rows: |
          select 'event-edge' as event_id, 99999.99::double as event_volume_usd_lifetime_reported,
            timestamp '2026-01-01' as created_at,
            timestamp '2026-06-01' as observed_at,
            timestamp '2026-06-01' as source_updated_at
          union all
          select 'event-edge', 100000.0, timestamp '2026-01-01',
            timestamp '2026-06-02', timestamp '2026-06-02'
          union all
          select 'event-corrected', 120000.0, timestamp '2026-02-01',
            timestamp '2026-06-01', timestamp '2026-06-01'
          union all
          select 'event-corrected', 90000.0, timestamp '2026-02-01',
            timestamp '2026-06-03', timestamp '2026-06-03'
          union all
          select 'event-below', 99999.999, timestamp '2026-03-01',
            timestamp '2026-06-04', timestamp '2026-06-04'
          union all
          select 'event-sparse', 120000.0, timestamp '2026-04-01',
            timestamp '2026-06-01', timestamp '2026-06-01'
          union all
          select 'event-sparse', 130000.0, null::timestamp,
            timestamp '2026-06-05', timestamp '2026-06-05'
          union all
          select 'event-missing-created', 150000.0, null::timestamp,
            timestamp '2026-06-06', timestamp '2026-06-06'
      - input: ref('polymarket_wc2026_logical_contract')
        format: sql
        rows: |
          select 100000.0::double as event_volume_min_usd
    expect:
      rows:
        - {event_id: event-below, created_at: '2026-03-01 00:00:00', currently_eligible: false, ever_eligible: false, first_eligible_observed_at: null, eligibility_effective_from: null, event_volume_min_usd: 100000.0}
        - {event_id: event-corrected, created_at: '2026-02-01 00:00:00', currently_eligible: false, ever_eligible: true, first_eligible_observed_at: '2026-06-01 00:00:00', eligibility_effective_from: '2026-02-01 00:00:00', event_volume_min_usd: 100000.0}
        - {event_id: event-edge, created_at: '2026-01-01 00:00:00', currently_eligible: true, ever_eligible: true, first_eligible_observed_at: '2026-06-02 00:00:00', eligibility_effective_from: '2026-01-01 00:00:00', event_volume_min_usd: 100000.0}
        - {event_id: event-missing-created, created_at: null, currently_eligible: true, ever_eligible: true, first_eligible_observed_at: '2026-06-06 00:00:00', eligibility_effective_from: null, event_volume_min_usd: 100000.0}
        - {event_id: event-sparse, created_at: '2026-04-01 00:00:00', currently_eligible: true, ever_eligible: true, first_eligible_observed_at: '2026-06-01 00:00:00', eligibility_effective_from: '2026-04-01 00:00:00', event_volume_min_usd: 100000.0}

  - name: test_wc2026_membership_review_matrix
    model: int_polymarket_wc2026_event_membership
    given:
      - input: ref('int_polymarket_wc2026_event_latest')
        format: sql
        rows: |
          select 'reviewed-in' as event_id, 'World Cup winner' as event_title,
            'world-cup-winner' as event_slug, 'sporting' as event_description,
            '["2026-fifa-world-cup"]' as tags_json, '[]' as series_slugs_json,
            true as ever_eligible, timestamp '2026-01-01' as created_at
          union all
          select 'reviewed-out', 'Announcer mentions a politician',
            'world-cup-mentions', 'culture', '["2026-fifa-world-cup"]', '[]', true,
            timestamp '2026-01-01'
          union all
          select 'fixture-auto', 'USA vs Paraguay', 'fifwc-usa-par',
            'fixture', '["2026-fifa-world-cup"]', '["soccer-fifwc"]', true,
            timestamp '2026-01-01'
          union all
          select 'unreviewed', 'World Cup adjacent question', 'wc-adjacent',
            'unknown', '["fifa-world-cup"]', '[]', true, timestamp '2026-01-01'
          union all
          select 'related-only', 'Related soccer event', 'related-soccer',
            'recall candidate', '["soccer"]', '[]', true, timestamp '2026-01-01'
          union all
          select 'reviewed-no-created', 'World Cup special', 'world-cup-special',
            'sporting', '["2026-fifa-world-cup"]', '[]', true, null::timestamp
      - input: ref('int_polymarket_wc2026_fixture_events')
        format: sql
        rows: |
          select 'fixture-auto' as event_id, 1 as fifa_match_id,
            'group_stage' as fixture_stage, 'A' as group_label,
            'exact_event_slug' as fixture_mapping_basis
      - input: source('polymarket_wc2026_raw', 'reviewed_event_membership')
        format: sql
        rows: |
          select 'reviewed-in' as event_id, 'included' as membership_status,
            'sporting' as membership_class, 'tournament_wide' as tournament_part,
            'reviewed_inclusion' as membership_basis, 'sporting outcome' as reason,
            'reviewer' as reviewed_by, '2026-08-02T00:00:00Z' as reviewed_at_utc
          union all
          select 'reviewed-out', 'excluded', 'culture_mentions', 'tournament_wide',
            'reviewed_exclusion', 'not a sporting outcome', 'reviewer',
            '2026-08-02T00:00:00Z'
          union all
          select 'reviewed-no-created', 'included', 'sporting', 'tournament_wide',
            'reviewed_inclusion', 'sporting outcome', 'reviewer',
            '2026-08-02T00:00:00Z'
      - input: ref('polymarket_wc2026_logical_contract')
        format: sql
        rows: |
          select '2026-fifa-world-cup' as required_event_tag,
            'wc2026-finals-sporting-v1' as policy_version,
            'polymarket-wc2026-logical-v1' as contract_name,
            '1' as contract_version
    expect:
      rows:
        - {event_id: fixture-auto, membership_status: included, membership_class: sporting, tournament_part: group_stage, scope_id: 'scope:wc2026:fixture:1', is_logical_event: true}
        - {event_id: reviewed-in, membership_status: included, membership_class: sporting, tournament_part: tournament_wide, scope_id: 'scope:wc2026:tournament_wide', is_logical_event: true}
        - {event_id: reviewed-no-created, membership_status: included, membership_class: sporting, tournament_part: tournament_wide, scope_id: 'scope:wc2026:tournament_wide', is_logical_event: true}
        - {event_id: reviewed-out, membership_status: excluded, membership_class: culture_mentions, tournament_part: null, scope_id: null, is_logical_event: false}
        - {event_id: unreviewed, membership_status: review_required, membership_class: other_adjacent, tournament_part: null, scope_id: null, is_logical_event: false}
        - {event_id: related-only, membership_status: review_required, membership_class: sporting_candidate, tournament_part: null, scope_id: null, is_logical_event: false}

  - name: test_wc2026_logical_events_preserve_standalone_audit_candidates
    model: polymarket_wc2026_logical_events
    given:
      - input: ref('int_polymarket_wc2026_event_membership')
        format: sql
        rows: |
          select 'excluded-event' as event_id, 'excluded' as event_slug,
            'Excluded candidate' as event_title, '' as event_description,
            null::varchar as resolution_source, '[]' as tags_json,
            '[]' as series_slugs_json, '["related_2026_tag_recall"]' as candidate_sources_json,
            150000.0::double as event_volume_usd_lifetime_reported,
            timestamp '2026-08-02' as observed_at,
            timestamp '2026-08-01' as first_seen_at,
            timestamp '2026-08-01' as first_eligible_observed_at,
            timestamp '2026-01-01' as eligibility_effective_from,
            true as ever_eligible, true as currently_eligible,
            false as volume_unknown, timestamp '2026-01-01' as created_at,
            true as is_active, false as is_closed, false as is_archived,
            false as neg_risk, null::varchar as neg_risk_market_id,
            false as show_all_outcomes, null::timestamp as event_start_at,
            null::timestamp as start_at, null::timestamp as end_at,
            null::timestamp as finished_at, null::varchar as game_id,
            null::integer as fifa_match_id, null::varchar as fixture_group_label,
            null::varchar as fixture_mapping_basis, 'excluded' as membership_status,
            'other_adjacent' as membership_class, null::varchar as tournament_part,
            null::varchar as scope_id, 'reviewed_exclusion' as membership_basis,
            'Adjacent event' as membership_reason, 'policy-v1' as membership_policy_version,
            false as is_logical_event
          union all
          select 'unknown-volume', 'unknown-volume', 'Unknown-volume candidate', '',
            null, '[]', '[]', '["related_2026_tag_recall"]', null,
            timestamp '2026-08-02', timestamp '2026-08-01', null,
            null, false, false, true, timestamp '2026-01-01', true, false,
            false, false, null, false, null, null, null, null, null, null,
            null, null, 'review_required', 'sporting_candidate', null, null,
            'unreviewed_candidate', 'Needs review', 'policy-v1', false
      - input: ref('int_polymarket_wc2026_logical_market_events')
        format: sql
        rows: |
          select null::varchar as event_id, null::varchar as market_id where false
      - input: ref('int_polymarket_wc2026_logical_markets')
        format: sql
        rows: |
          select null::varchar as market_id, false as logical_usable,
            null::varchar as market_neg_risk_market_id where false
    expect:
      rows:
        - {event_id: excluded-event, membership_status: excluded, volume_unknown: false, event_logical_eligible: false}
        - {event_id: unknown-volume, membership_status: review_required, volume_unknown: true, event_logical_eligible: false}

  - name: test_wc2026_multi_event_market_has_one_deterministic_primary
    model: int_polymarket_wc2026_logical_market_events
    given:
      - input: ref('stg_polymarket_wc2026_event_snapshots')
        format: sql
        rows: |
          select 'event-general' as event_id, timestamp '2026-08-02' as observed_at
          union all
          select 'event-fixture', timestamp '2026-08-02'
      - input: ref('stg_polymarket_wc2026_event_markets')
        format: sql
        rows: |
          select 'event-general' as event_id, 'market-shared' as market_id,
            0 as source_ordinal, true as is_enclosing_event,
            timestamp '2026-08-02' as observed_at
          union all
          select 'event-fixture', 'market-shared', 1, false,
            timestamp '2026-08-02'
          union all
          select 'event-general', 'market-removed-later', 4, false,
            timestamp '2026-07-01'
          union all
          select 'event-general', 'market-current', 2, false,
            timestamp '2026-08-02'
      - input: ref('int_polymarket_wc2026_event_membership')
        format: sql
        rows: |
          select 'event-general' as event_id, timestamp '2026-01-01' as created_at,
            true as is_logical_event, 'included' as membership_status,
            true as ever_eligible, false as volume_unknown
          union all
          select 'event-fixture', timestamp '2026-02-01', true, 'included',
            true, false
      - input: ref('int_polymarket_wc2026_fixture_events')
        format: sql
        rows: |
          select 'event-fixture' as event_id, 1 as fifa_match_id,
            'exact_event_slug' as fixture_mapping_basis
    expect:
      rows:
        - {event_id: event-fixture, market_id: market-shared, source_ordinal: 1, fifa_match_id: 1, is_primary_qualifying_event: true}
        - {event_id: event-general, market_id: market-shared, source_ordinal: 0, fifa_match_id: null, is_primary_qualifying_event: false}
        - {event_id: event-general, market_id: market-current, source_ordinal: 2, fifa_match_id: null, is_primary_qualifying_event: true}

  - name: test_wc2026_logical_team_identities_are_unique_alias_lookups
    model: int_polymarket_wc2026_logical_team_identities
    given:
      - input: ref('stg_openfootball_wc2026_schedule_fixtures')
        format: sql
        rows: |
          select 'United States' as home_team, 'Cape Verde' as away_team
          union all select 'united states', 'cabo verde'
      - input: ref('wc2026_team_canonical_aliases')
        format: sql
        rows: |
          select 'usa' as variant_match_key,
            'united states' as canonical_match_key
          union all select 'united states', 'united states'
          union all select 'cpv', 'cabo verde'
          union all select 'cape verde', 'cabo verde'
          union all select 'cabo verde', 'cabo verde'
          union all select 'italy', 'italy'
    expect:
      rows:
        - {team_name: United States, source_match_key: usa, team_match_key: usa, canonical_match_key: united states, canonical_team_id: 152649df347ee2891a9eacc883e07d17}
        - {team_name: United States, source_match_key: united states, team_match_key: united states, canonical_match_key: united states, canonical_team_id: 152649df347ee2891a9eacc883e07d17}
        - {team_name: Cape Verde, source_match_key: cpv, team_match_key: cpv, canonical_match_key: cabo verde, canonical_team_id: 346874cd7c9ecf2a4ec7b97e958655f1}
        - {team_name: Cape Verde, source_match_key: cape verde, team_match_key: cape verde, canonical_match_key: cabo verde, canonical_team_id: 346874cd7c9ecf2a4ec7b97e958655f1}
        - {team_name: Cape Verde, source_match_key: cabo verde, team_match_key: cabo verde, canonical_match_key: cabo verde, canonical_team_id: 346874cd7c9ecf2a4ec7b97e958655f1}
        - {team_name: italy, source_match_key: italy, team_match_key: italy, canonical_match_key: italy, canonical_team_id: bab4ac375adad13f5693f24fceab7903}

  - name: test_wc2026_proposition_entities_include_fixture_group_and_stage_context
    model: polymarket_wc2026_logical_proposition_entities
    given:
      - input: ref('polymarket_wc2026_logical_propositions')
        format: sql
        rows: |
          select 'prop-player' as source_proposition_id,
            'player:endrick' as predicate_subject_entity_id,
            'metric:goals' as predicate_object, 'market-player' as market_id,
            'records_statistic' as predicate
          union all
          select 'prop-result', 'fixture:5', 'team:brazil',
            'market-result', 'wins_match'
      - input: ref('polymarket_wc2026_logical_markets')
        format: sql
        rows: |
          select 'market-player' as market_id, 5 as fifa_match_id,
            'group_stage' as tournament_part,
            'Endrick: 1+ goals' as group_item_title
          union all
          select 'market-result', 5, 'group_stage', 'Match result'
      - input: ref('polymarket_wc2026_logical_entities')
        format: sql
        rows: |
          select 'fixture:5' as entity_id, 'a' as group_label,
            null::varchar as home_team_entity_id,
            null::varchar as away_team_entity_id
      - input: ref('int_polymarket_wc2026_logical_player_teams')
        format: sql
        rows: |
          select null::varchar as player_entity_id,
            null::varchar as canonical_team_entity_id where false
      - input: ref('int_polymarket_wc2026_logical_team_identities')
        format: sql
        rows: |
          select null::varchar as team_match_key,
            null::varchar as canonical_team_id where false
      - input: ref('wc2026_team_canonical_aliases')
        format: sql
        rows: |
          select null::varchar as variant_match_key,
            null::varchar as canonical_match_key where false
    expect:
      rows:
        - {source_proposition_id: prop-player, entity_id: 'player:endrick', entity_role: subject}
        - {source_proposition_id: prop-player, entity_id: 'fixture:5', entity_role: referenced}
        - {source_proposition_id: prop-player, entity_id: 'group:a', entity_role: referenced}
        - {source_proposition_id: prop-player, entity_id: 'stage:group_stage', entity_role: referenced}
        - {source_proposition_id: prop-result, entity_id: 'fixture:5', entity_role: subject}
        - {source_proposition_id: prop-result, entity_id: 'team:brazil', entity_role: referenced}
        - {source_proposition_id: prop-result, entity_id: 'fixture:5', entity_role: referenced}
        - {source_proposition_id: prop-result, entity_id: 'group:a', entity_role: referenced}
        - {source_proposition_id: prop-result, entity_id: 'stage:group_stage', entity_role: referenced}

  - name: test_wc2026_logical_market_family_and_child_scope
    model: int_polymarket_wc2026_logical_markets
    given:
