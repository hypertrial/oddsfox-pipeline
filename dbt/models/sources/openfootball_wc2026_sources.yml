version: 2

sources:
  - name: openfootball_wc2026_raw
    description: OpenFootball machine-readable mirror of the complete official-numbered WC2026 schedule.
    schema: openfootball_wc2026_raw
    tables:
      - name: schedule_fixtures
        description: All 104 FIFA-numbered WC2026 fixtures, including group and knockout stages.
        meta:
          dagster:
            asset_key: [openfootball, wc2026, raw, schedule_fixtures]
        columns:
          - name: fifa_match_id
            description: Published numeric FIFA match number.
            tests: [not_null, unique]
          - name: stage_key
            description: Normalized match stage.
            tests: [not_null]
          - name: kickoff_at_utc
            description: Scheduled kickoff normalized to UTC.
            tests: [not_null]
          - name: source_loaded_at
            description: UTC time when the source mirror was loaded.
