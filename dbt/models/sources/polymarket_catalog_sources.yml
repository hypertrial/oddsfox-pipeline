version: 2

sources:
  - name: polymarket_catalog_raw
    description: >
      Cumulative observations from complete, unfiltered open and closed Gamma
      event and market keyset crawls.
    schema: polymarket_catalog_raw
    tables:
      - name: event_snapshots
        description: One normalized event observation per completed crawl and event ID.
        meta:
          dagster:
            asset_key: [polymarket, catalog, raw, crawl]
        columns:
          - name: event_id
            tests: [not_null]
      - name: market_snapshots
        description: One normalized market observation per completed crawl and market ID.
        meta:
          dagster:
            asset_key: [polymarket, catalog, raw, crawl]
        columns:
          - name: market_id
            tests: [not_null]
      - name: event_market_snapshots
        description: Event-market membership evidence from either Gamma endpoint.
        meta:
          dagster:
            asset_key: [polymarket, catalog, raw, crawl]
  - name: polymarket_catalog_ops
    description: Catalog run state and resumable page checkpoints.
    schema: polymarket_catalog_ops
    tables:
      - name: crawl_runs
        description: Crawl activation and completeness ledger.
        meta:
          dagster:
            asset_key: [polymarket, catalog, raw, crawl]
        columns:
          - name: crawl_id
            tests: [not_null, unique]
