version: 2

models:
  - name: polymarket_us_midterms_2026_markets
    description: >
      Public market catalog for every Polymarket market with reported volume at
      or above $100,000 USD (same platform-wide catalog sync as
      polymarket_wc2026_markets; no midterms tag or registry filter). One row
      per market_id with identity, description, outcomes, token IDs, timing,
      category, and tags. Distinct from
      int_polymarket_us_midterms_2026_markets ($5,000 intermediate floor) and
      from the hourly odds mart.
    tests:
      - no_duplicate_grain:
          arguments:
            grain_columns: [market_id]
    columns:
      - name: market_id
        description: Polymarket market identifier.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_polymarket_catalog_markets')
                field: market_id
      - name: event_id
        description: Parent Gamma event id when present on the market payload.
      - name: event_slug
        description: Parent Polymarket event slug when known.
      - name: question
        description: Market prompt text.
        tests: [not_null]
      - name: description
        description: Market description prose, including resolution criteria when Gamma provides it.
      - name: outcomes
        description: JSON text array of outcome labels.
        tests: [not_null]
      - name: clob_token_ids
        description: >
          JSON text array of CLOB outcome token identifiers when Gamma provides
          them; null for some older high-volume markets that predate CLOB tokens.
      - name: start_time
        description: coalesce(game_start_time, event_start_time) from Gamma; null when neither is present.
      - name: end_time
        description: Market end_date from Gamma; null when missing.
      - name: category
        description: Market category when Gamma provides one.
      - name: tags
        description: JSON text of market tags when present on the Gamma market payload.

  - name: polymarket_us_midterms_2026_market_token_hourly_odds
    description: >
      US midterms 2026 market tokens joined to admitted markets and trailing
      hourly OHLC odds. No office-type classification in v1.
    tests:
      - no_duplicate_grain:
          arguments:
            grain_columns: [clob_token_id, odds_hour_epoch]
      - price_columns_in_unit_interval:
          arguments:
            identifier_columns: [clob_token_id, odds_hour_epoch]
            price_columns:
              - open_price
              - high_price
              - low_price
              - close_price
              - avg_price
    columns:
      - name: clob_token_id
        description: Polymarket CLOB outcome token identifier.
        tests: [not_null]
      - name: market_id
        description: Polymarket market identifier.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_polymarket_us_midterms_2026_markets')
                field: market_id
      - name: outcome_index
        description: Zero-based outcome index within the source market.
        tests: [not_null]
      - name: outcome_label
        description: Source token label, usually Yes or No.
        tests: [not_null]
      - name: question
        description: Source market question.
        tests: [not_null]
      - name: event_slug
        description: Polymarket event slug.
        tests: [not_null]
      - name: odds_hour_epoch
        description: Unix epoch seconds for the UTC hour bucket.
        tests: [not_null]

unit_tests:
  - name: test_polymarket_us_midterms_2026_markets_applies_100k_volume_floor
    model: polymarket_us_midterms_2026_markets
    given:
      - input: ref('stg_polymarket_catalog_markets')
        format: sql
        rows: |
          select 'above-floor' as market_id, 'evt-m-1' as event_id, 'us-midterms-2026' as event_slug,
            'Which party wins the House?' as question,
            'Resolves to the popular-vote winner.' as description,
            '["Dem","Rep"]' as outcomes, '["dem","rep"]' as clob_token_ids,
            timestamp '2026-11-03 00:00:00' as game_start_time,
            cast(null as timestamp) as event_start_time,
            timestamp '2026-11-04 00:00:00' as end_date,
            'Politics' as category, '[{"slug":"us-politics"}]' as tags, 100000.0 as volume
          union all
          select 'below-floor', 'evt-m-2', 'us-midterms-2026', 'Low volume race?', '',
            '["Yes","No"]', '["y","n"]',
            cast(null as timestamp), cast(null as timestamp), cast(null as timestamp),
            cast(null as varchar), cast(null as varchar), 50000.0
          union all
          select 'high-volume-other', 'evt-m-3', 'other', 'Unrelated?', '',
            '["Yes","No"]', '["a","b"]',
            cast(null as timestamp), cast(null as timestamp), cast(null as timestamp),
            cast(null as varchar), cast(null as varchar), 500000.0
    expect:
      rows:
        - {
            market_id: "above-floor",
            event_id: "evt-m-1",
            event_slug: "us-midterms-2026",
            question: "Which party wins the House?",
            description: "Resolves to the popular-vote winner.",
            outcomes: '["Dem","Rep"]',
            clob_token_ids: '["dem","rep"]',
            start_time: "2026-11-03 00:00:00",
            end_time: "2026-11-04 00:00:00",
            category: "Politics",
            tags: '[{"slug":"us-politics"}]'
          }
        - {
            market_id: "high-volume-other",
            event_id: "evt-m-3",
            event_slug: "other",
            question: "Unrelated?",
            description: "",
            outcomes: '["Yes","No"]',
            clob_token_ids: '["a","b"]',
            start_time: null,
            end_time: null,
            category: null,
            tags: null
          }

  - name: test_us_midterms_hourly_mart_preserves_token_hour_grain
    model: polymarket_us_midterms_2026_market_token_hourly_odds
    given:
      - input: ref('int_polymarket_us_midterms_2026_market_tokens')
        rows:
          - {
              market_id: "midterms-market-1",
              outcome_index: 0,
              clob_token_id: "token-yes",
              outcome_label: "Yes"
            }
      - input: ref('int_polymarket_us_midterms_2026_markets')
        rows:
          - {
              market_id: "midterms-market-1",
              question: "Which party will win the 2026 House popular vote?",
              event_slug: "us-midterms-2026",
              is_active: true,
              is_closed: false,
              volume: 25000.0
            }
      - input: ref('int_polymarket_us_midterms_2026_token_hourly_odds')
        rows:
          - {
              clob_token_id: "token-yes",
              odds_hour_utc: "2026-01-01 00:00:00",
              odds_hour_epoch: 1767225600,
              open_price: 0.40,
              high_price: 0.45,
              low_price: 0.39,
              close_price: 0.44,
              avg_price: 0.42,
              observed_points: 3,
              first_timestamp: 1767225600,
              first_observed_at: "2026-01-01 00:00:00",
              last_timestamp: 1767229200,
              last_observed_at: "2026-01-01 01:00:00"
            }
    expect:
      rows:
        - {
            market_id: "midterms-market-1",
            clob_token_id: "token-yes",
            odds_hour_epoch: 1767225600,
            close_price: 0.44,
            observed_points: 3
          }
