version: 2

models:
  - name: int_polymarket_soccer_match_result_market_state
    description: Current exact-window market metadata and deterministic source revision.
  - name: int_polymarket_soccer_match_result_observed
    description: Private dirty-market incremental sparse Yes and native No token minute OHLC state.
  - name: int_polymarket_soccer_match_result_minute_odds
    description: Private dirty-market incremental inclusive dense minute state with independent Yes and No observation flags.
  - name: int_polymarket_soccer_match_result_modeling_games
    description: Games with three result markets, fully populated Yes prices, at least 99 percent Yes observed-minute coverage, and no Yes observation gap over three minutes. Native No coverage is diagnostic only.
    columns:
      - name: event_id
        tests: [not_null, unique]
  - name: polymarket_soccer_matches
    description: One row per strictly mapped exact-tag Polymarket soccer match.
    columns:
      - name: event_id
        tests: [not_null, unique]
  - name: polymarket_soccer_match_result_minute_odds_observed
    description: Sparse observed Yes-token and native No-token minute OHLC for home, draw, and away result markets.
    tests:
      - no_duplicate_grain:
          arguments:
            grain_columns: [market_id, odds_minute_epoch]
  - name: polymarket_soccer_match_result_minute_odds
    description: Dense in-game minute odds with explicit Yes and native No observation and carry age.
    tests:
      - no_duplicate_grain:
          arguments:
            grain_columns: [market_id, odds_minute_epoch]
    columns:
      - name: result_role
        tests:
          - accepted_values:
              arguments:
                values: [home_win, draw, away_win]
  - name: polymarket_soccer_match_result_minute_odds_modeling
    description: Modeling-ready, fully priced dense minute odds for three-market games with at least 99 percent Yes observed coverage and no Yes gap over three minutes. Native No prices and coverage are diagnostic and may be null.
    tests:
      - no_duplicate_grain:
          arguments:
            grain_columns: [market_id, odds_minute_epoch]
    columns:
      - name: result_role
        tests:
          - accepted_values:
              arguments:
                values: [home_win, draw, away_win]
      - name: open_odds
        tests: [not_null]
      - name: high_odds
        tests: [not_null]
      - name: low_odds
        tests: [not_null]
      - name: close_odds
        tests: [not_null]
      - name: avg_odds
        tests: [not_null]
      - name: observed_minute_coverage_percent
        tests: [not_null]
      - name: maximum_consecutive_gap_minutes
        tests: [not_null]
  - name: polymarket_soccer_match_result_data_quality
    description: Current mapping, fetch, observed, scheduled/due/recoverable dense coverage, carry, and retry counts.
  - name: polymarket_soccer_match_result_exclusions
    description: Current event exclusions with stable fail-closed reasons.
  - name: polymarket_soccer_match_result_token_fetch_status
    description: Current six-token exact-window publication and retry status.
    tests:
      - no_duplicate_grain:
          arguments:
            grain_columns: [clob_token_id, window_start_at, window_end_at]
  - name: polymarket_soccer_pipeline_trends
    description: Successful full-run metrics and prior-run deltas.
    columns:
      - name: dagster_run_id
        tests: [not_null, unique]
  - name: polymarket_soccer_pipeline_alerts
    description: Current local warning and critical conditions with stable codes.
  - name: polymarket_soccer_pipeline_health
    description: Single-row production-health summary for operators and automation.
