name: Manual Full Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-full-${{ github.ref }}
  cancel-in-progress: false

env:
  KALSHI_WC2026_HOURLY_ODDS_SCHEDULE_ENABLED: "false"
  GATE_JOBS: "2"

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --no-default-groups --group coverage
      - name: Coverage gate
        run: uv run make -j"$GATE_JOBS" release-gate-coverage

  dbt-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --no-default-groups --group test --group dbt-lint
      - name: Install pinned Costguard
        run: |
          curl -fsSL https://raw.githubusercontent.com/hypertrial/costguard/v2.5.0/scripts/install.sh -o /tmp/install-costguard.sh
          sh /tmp/install-costguard.sh v2.5.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: dbt quality gate
        run: uv run make -j"$GATE_JOBS" release-gate-dbt-quality

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --no-default-groups --group mutation
      - name: Focused mutation gate
        run: uv run make mutation-ci
      - name: Export mutation statistics
        if: always()
        run: uv run mutmut export-cicd-stats
      - name: Upload mutation statistics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutmut-cicd-stats
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: error
          retention-days: 7

  static-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --no-default-groups --group test --group python-lint --group dbt-lint --group docs-render
      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/.cache/runtime/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}-chromium
      - name: Install Chromium for rendered documentation checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/runtime/ms-playwright
        run: uv run playwright install --with-deps chromium
      - name: Python lint
        run: uv run make python-lint
      - name: Fail-closed dbt lint
        run: uv run make dbt-lint
      - name: Repository policy
        run: uv run make check-repository
      - name: Package distribution smoke
        run: uv run make package-smoke
      - name: Replay-only HTTP contracts
        run: uv run make contract-http
      - name: Strict documentation build
        run: uv run make docs-build
      - name: Rendered documentation checks
        run: uv run make docs-test

  full-gate:
    if: always()
    needs: [coverage, dbt-quality, mutation, static-docs]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every full-validation worker
        run: |
          test "${{ needs.coverage.result }}" = "success"
          test "${{ needs.dbt-quality.result }}" = "success"
          test "${{ needs.mutation.result }}" = "success"
          test "${{ needs.static-docs.result }}" = "success"
